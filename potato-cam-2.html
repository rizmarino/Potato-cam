<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🥔 Potato Cam</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0d0b08">
<meta name="permissions-policy" content="camera=(self)">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0d0b08; color: #f1e9d8;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  #app {
    position: relative; width: 100vw; display: flex; flex-direction: column;
    height: 100vh; /* fallback */
    height: calc(var(--vh, 1vh) * 100);
    overflow-y: auto;
  }

  #stage {
    position: relative; flex: 1 1 auto; min-height: 120px; overflow: hidden;
    background: #000; display: flex; align-items: center; justify-content: center;
  }
  canvas#view { width: 100%; height: 100%; object-fit: cover; display: block; background:#000; }
  video#src { display: none; }

  #title {
    position: absolute; top: env(safe-area-inset-top, 12px); left: 0; right: 0;
    text-align: center; padding-top: 10px; z-index: 5; pointer-events: none;
  }
  #title h1 {
    margin: 0; font-size: 20px; letter-spacing: 1px;
    color: #ffd873; text-shadow: 0 2px 6px rgba(0,0,0,.6);
  }
  #title span { font-size: 11px; color: #d9c9a3; opacity: .85; }

  #flash {
    position: absolute; inset: 0; background: #fff; opacity: 0;
    pointer-events: none; z-index: 20;
  }
  #flash.on { animation: flashpop .25s ease-out; }
  @keyframes flashpop { 0% { opacity: .9; } 100% { opacity: 0; } }

  #savedToast {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: rgba(23,19,13,.92); color: #ffd873; font-size: 13px; font-weight: 600;
    padding: 8px 16px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease; z-index: 15;
    border: 1px solid #4a3c22;
  }
  #savedToast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  #permMsg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px; padding: 24px; text-align: center; z-index: 10;
    background: #0d0b08;
  }
  #permMsg button {
    background: #ffd873; color: #3a2b0d; border: none; padding: 12px 22px;
    border-radius: 999px; font-weight: 700; font-size: 15px;
  }

  #controls {
    padding: 14px 16px calc(22px + env(safe-area-inset-bottom, 12px));
    background: linear-gradient(180deg, #17130d, #0d0b08);
    display: flex; flex-direction: column; gap: 10px; z-index: 5;
    flex-shrink: 0;
  }
  #bottomWrap { display: contents; }
  #typeRow {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
    order: 1;
  }
  #typeRow::-webkit-scrollbar { display: none; }
  .typeChip {
    flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: #1c1710; border: 1px solid #3a2f1e; color: #cbb98a;
    padding: 7px 12px; border-radius: 14px; font-size: 18px; min-width: 58px;
  }
  .typeChip span { font-size: 10px; font-weight: 600; color: inherit; }
  .typeChip.active {
    background: #3a2b0d; border-color: #ffd873; color: #ffd873;
    box-shadow: 0 0 0 1px #ffd87355;
  }

  .row { display: flex; align-items: center; gap: 10px; }
  .row label { font-size: 12px; width: 78px; color: #cbb98a; flex-shrink: 0; }
  .potatoRow { order: 2; }
  .noiseRow { order: 3; }
  input[type=range] {
    flex: 1; height: 4px; -webkit-appearance: none; background: #3a3020; border-radius: 2px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: #ffd873; border: 2px solid #3a2b0d;
  }
  .val { width: 34px; text-align: right; font-size: 12px; color: #ffd873; }

  #btnRow { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; order: 4; }
  .iconBtn {
    background: #241d13; border: 1px solid #4a3c22; color: #f1e9d8;
    width: 46px; height: 46px; border-radius: 50%; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
  }
  #shutter {
    width: 72px; height: 72px; border-radius: 50%; background: #ffd873;
    border: 5px solid #6b551f; box-shadow: 0 0 0 3px #ffd87355;
  }
  #shutter:active { background: #e0b94f; }

  #gallery {
    position: fixed; inset: 0; background: #0d0b08; z-index: 30; display: none;
    flex-direction: column;
  }
  #gallery.open { display: flex; }
  #galTop { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; }
  #galTop button { background: none; border: none; color: #ffd873; font-size: 16px; padding: 6px 10px; }
  #galImgWrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; overflow: hidden; position: relative; touch-action: pan-y; }
  #galImgWrap img { max-width: 100%; max-height: 100%; border-radius: 4px; box-shadow: 0 8px 30px rgba(0,0,0,.5); user-select: none; -webkit-user-drag: none; }
  .galNavBtn {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid #4a3c22;
    background: rgba(23,19,13,.75); color: #ffd873; font-size: 24px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .galNavBtn:disabled { opacity: 0.25; }
  #galPrev { left: 8px; }
  #galNext { right: 8px; }
  #galActions { display: flex; gap: 10px; padding: 14px 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
  #galActions button {
    flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 700; font-size: 14px;
  }
  #galActions .save { background: #ffd873; color: #3a2b0d; }
  #galActions .del { background: #3a2417; color: #ff9d7a; }
  #emptyGal { margin: auto; color: #8a7a58; font-size: 13px; text-align: center; padding: 40px; }

  /* Landscape: dock controls to the right as a fixed-width strip instead of
     stacking them below, so the shutter stays reachable and the video stage
     gets the rest of the width. Photos captured here come out landscape.
     This block is deliberately last in the stylesheet so it wins the cascade
     over the base rules above when the media query matches. */
  @media (orientation: landscape) {
    #app { flex-direction: row; }
    #controls {
      width: 240px; flex-shrink: 0; flex-direction: column; justify-content: flex-start;
      overflow-y: auto; padding: 12px 10px 12px calc(10px + env(safe-area-inset-right, 0px));
      gap: 14px;
    }
    #stage { min-width: 120px; }
    .row { flex-direction: column; align-items: stretch; gap: 4px; }
    .row label { width: auto; }
    .row input[type=range] { width: 100%; }
    #title { top: env(safe-area-inset-top, 8px); }
    #title span { display: none; }

    /* Filter chips sit to the left of the shutter/flip/gallery column,
       same horizontal-scrolling chip style as portrait — just repositioned. */
    #bottomWrap {
      display: flex; flex-direction: row; align-items: center; gap: 10px;
      order: 5; margin-top: auto;
    }
    #typeRow { flex: 1; min-width: 0; order: initial; }
    #btnRow { flex-direction: column; gap: 12px; margin-top: 0; order: initial; flex-shrink: 0; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="title"><h1>🥔 Potato Cam</h1><span>lowering your camera's self-esteem since today</span></div>

  <div id="stage">
    <video id="src" playsinline muted autoplay></video>
    <canvas id="view"></canvas>
    <div id="flash"></div>
    <div id="savedToast">Saved to Downloads ✓</div>
    <div id="permMsg" style="display:none;">
      <div style="font-size:40px;">🥔</div>
      <div>Potato Cam needs camera access to make your photos worse.</div>
      <button id="askPerm">Allow Camera</button>
    </div>
  </div>

  <div id="controls">
    <div id="bottomWrap">
      <div id="typeRow">
        <button class="typeChip active" data-type="russet">🥔<span>Russet</span></button>
        <button class="typeChip" data-type="sweet">🍠<span>Sweet</span></button>
        <button class="typeChip" data-type="purple">🍆<span>Purple</span></button>
        <button class="typeChip" data-type="red">🔴<span>Red</span></button>
        <button class="typeChip" data-type="gold">🟡<span>Gold</span></button>
        <button class="typeChip" data-type="frozen">🧊<span>Frozen</span></button>
      </div>
      <div id="btnRow">
        <button class="iconBtn" id="flipBtn" title="Switch camera">🔄</button>
        <button id="shutter" title="Capture"></button>
        <button class="iconBtn" id="galBtn" title="Gallery">🖼️</button>
      </div>
    </div>
    <div class="row potatoRow">
      <label>Potato-ness</label>
      <input id="potato" type="range" min="1" max="10" value="3">
      <div class="val" id="potatoVal">3</div>
    </div>
    <div class="row noiseRow">
      <label>Grime / Noise</label>
      <input id="noise" type="range" min="0" max="10" value="2">
      <div class="val" id="noiseVal">2</div>
    </div>
  </div>
</div>

<div id="gallery">
  <div id="galTop">
    <button id="galClose">✕ Close</button>
    <span id="galCount" style="font-size:12px;color:#8a7a58;"></span>
  </div>
  <div id="galImgWrap">
    <button id="galPrev" class="galNavBtn" aria-label="Previous photo">‹</button>
    <img id="galImg" alt="Captured photo" style="display:none;">
    <div id="emptyGal">No potatoes captured yet.</div>
    <button id="galNext" class="galNavBtn" aria-label="Next photo">›</button>
  </div>
  <div id="galActions" style="display:none;">
    <button class="save" id="galSave">Save again</button>
    <button class="del" id="galDel">Delete</button>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((err) => {
      console.warn('Service worker registration failed (offline caching won\'t work):', err);
    });
  });
}

(function () {
  const video = document.getElementById('src');
  const view = document.getElementById('view');
  const ctx = view.getContext('2d', { willReadFrequently: true });
  const permMsg = document.getElementById('permMsg');
  const askPerm = document.getElementById('askPerm');
  const flashEl = document.getElementById('flash');
  const savedToast = document.getElementById('savedToast');
  const potatoSlider = document.getElementById('potato');
  const noiseSlider = document.getElementById('noise');
  const potatoVal = document.getElementById('potatoVal');
  const noiseVal = document.getElementById('noiseVal');
  const shutter = document.getElementById('shutter');
  const flipBtn = document.getElementById('flipBtn');
  const galBtn = document.getElementById('galBtn');
  const gallery = document.getElementById('gallery');
  const galClose = document.getElementById('galClose');
  const galImgWrap = document.getElementById('galImgWrap');
  const galImg = document.getElementById('galImg');
  const galEmpty = document.getElementById('emptyGal');
  const galPrev = document.getElementById('galPrev');
  const galNext = document.getElementById('galNext');
  const galActions = document.getElementById('galActions');
  const galSave = document.getElementById('galSave');
  const galDel = document.getElementById('galDel');
  const galCount = document.getElementById('galCount');

  // Fix for mobile browsers/webviews where 100vh includes area hidden behind
  // the address bar or system nav bar, cutting off the bottom controls.
  function setRealVH() {
    const h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    document.documentElement.style.setProperty('--vh', `${h * 0.01}px`);
  }
  setRealVH();
  window.addEventListener('resize', setRealVH);
  window.addEventListener('orientationchange', () => setTimeout(setRealVH, 200));
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', setRealVH);
  }

  let stream = null;
  let facingMode = 'environment';
  let rafId = null;
  let shots = []; // {id, url, blob, filename} — loaded from IndexedDB on startup, kept in sync on capture/delete
  let galIndex = -1;

  // --- Persistent photo storage (IndexedDB) ---
  // A website can't create its own named folder in Android's shared storage —
  // that requires native filesystem permissions this app doesn't have. This
  // gives an equivalent result instead: photos live in the app's own private
  // database so the in-app gallery always has everything you've shot, across
  // restarts, independent of whatever's in the Downloads folder.
  const DB_NAME = 'potato-cam-db';
  const STORE_NAME = 'photos';
  let dbPromise = null;

  function getDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }

  async function dbPutPhoto(record) {
    const db = await getDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put(record);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function dbDeletePhoto(id) {
    const db = await getDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function dbGetAllPhotos() {
    const db = await getDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  async function loadShotsFromDB() {
    try {
      const records = await dbGetAllPhotos();
      records.sort((a, b) => b.id - a.id); // newest first
      shots = records.map((r) => ({
        id: r.id, blob: r.blob, filename: r.filename, url: URL.createObjectURL(r.blob)
      }));
    } catch (err) {
      console.warn('Could not load saved photos', err);
    }
  }
  loadShotsFromDB();

  potatoSlider.oninput = () => potatoVal.textContent = potatoSlider.value;
  noiseSlider.oninput = () => noiseVal.textContent = noiseSlider.value;

  document.querySelectorAll('.typeChip').forEach((chip) => {
    chip.addEventListener('click', () => {
      currentPotatoType = chip.dataset.type;
      document.querySelectorAll('.typeChip').forEach((c) => c.classList.remove('active'));
      chip.classList.add('active');
    });
  });

  function offscreen(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    return c;
  }

  // --- The potato pipeline ---
  // 1. Downscale hard (blocky pixelation), nearest-neighbor upscale
  // 2. Posterize color levels (banding)
  // 3. Push a sickly yellow-green cast + crushed contrast (bad auto white balance)
  // 4. Add per-pixel noise/grime
  // 5. Vignette
  // 6. On capture only: extra lossy JPEG re-compression pass
  // Potato variety presets — each is a color grade layered on top of the base
  // pixelation/posterize/noise pipeline. rShift/gShift/bShift are flat tint
  // offsets (always applied, independent of the potato-ness slider) and sat
  // is a saturation multiplier (1 = untouched, >1 = more vivid).
  const POTATO_TYPES = {
    russet:  { name: 'Russet',       emoji: '🥔', rShift: -8,  gShift: 4,   bShift: -12, sat: 1.0  },
    sweet:   { name: 'Sweet Potato', emoji: '🍠', rShift: 42,  gShift: 8,   bShift: -30, sat: 1.25 },
    purple:  { name: 'Purple',       emoji: '🍆', rShift: 6,   gShift: -18, bShift: 34,  sat: 1.3  },
    red:     { name: 'Red Potato',   emoji: '🔴', rShift: 34,  gShift: -14, bShift: -8,  sat: 1.2  },
    gold:    { name: 'Yukon Gold',   emoji: '🟡', rShift: 22,  gShift: 16,  bShift: -18, sat: 1.1  },
    frozen:  { name: 'Frozen',       emoji: '🧊', rShift: -20, gShift: 0,   bShift: 26,  sat: 0.85 }
  };
  let currentPotatoType = 'russet';

  function applySaturation(r, g, b, sat) {
    if (sat === 1) return [r, g, b];
    const gray = r * 0.299 + g * 0.587 + b * 0.114;
    return [
      gray + (r - gray) * sat,
      gray + (g - gray) * sat,
      gray + (b - gray) * sat
    ];
  }

  function potatoFrame(sourceCanvas, outCtx, outW, outH, potatoAmt, noiseAmt, extraJpegMangle, typeKey) {
    const p = potatoAmt / 10; // 0..1
    const n = noiseAmt / 10;

    // pixelation factor: at potato=1 ~ barely there, at 10 ~ chunky but still readable
    const blockDivisor = Math.max(1.4, 1 + p * 18); // ~2..19
    const smallW = Math.max(6, Math.floor(outW / blockDivisor));
    const smallH = Math.max(6, Math.floor(outH / blockDivisor));

    const small = offscreen(smallW, smallH);
    const sctx = small.getContext('2d');
    sctx.imageSmoothingEnabled = true;
    sctx.drawImage(sourceCanvas, 0, 0, smallW, smallH);

    outCtx.imageSmoothingEnabled = false;
    outCtx.clearRect(0, 0, outW, outH);
    outCtx.drawImage(small, 0, 0, smallW, smallH, 0, 0, outW, outH);

    // pixel-level mangling
    const imgData = outCtx.getImageData(0, 0, outW, outH);
    const d = imgData.data;
    const levels = Math.max(4, Math.round(14 - p * 8)); // fewer levels = more banding, floor raised
    const step = 255 / (levels - 1);

    const type = POTATO_TYPES[typeKey] || POTATO_TYPES.russet;

    for (let i = 0; i < d.length; i += 4) {
      let r = d[i], g = d[i + 1], b = d[i + 2];

      // posterize
      r = Math.round(Math.round(r / step) * step);
      g = Math.round(Math.round(g / step) * step);
      b = Math.round(Math.round(b / step) * step);

      // mild crushed contrast + slight warm/greenish white balance
      const contrast = 1 + p * 0.25;
      r = (r - 128) * contrast + 128 - p * 6;
      g = (g - 128) * contrast + 128 + p * 5;
      b = (b - 128) * contrast + 128 - p * 10;

      // potato-variety color grade
      [r, g, b] = applySaturation(r, g, b, type.sat);
      r += type.rShift; g += type.gShift; b += type.bShift;

      // grime noise
      if (n > 0) {
        const grain = (Math.random() - 0.5) * n * 45;
        r += grain; g += grain; b += grain;
      }

      d[i] = r < 0 ? 0 : r > 255 ? 255 : r;
      d[i + 1] = g < 0 ? 0 : g > 255 ? 255 : g;
      d[i + 2] = b < 0 ? 0 : b > 255 ? 255 : b;
    }
    outCtx.putImageData(imgData, 0, 0);

    // vignette
    const grad = outCtx.createRadialGradient(
      outW / 2, outH / 2, outH * 0.25,
      outW / 2, outH / 2, outH * 0.75
    );
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, `rgba(0,0,0,${0.12 + p * 0.22})`);
    outCtx.fillStyle = grad;
    outCtx.fillRect(0, 0, outW, outH);

    if (extraJpegMangle) {
      // simulate repeated lossy re-saves
      return outCtx.canvas;
    }
  }

  async function reJpegMangle(canvas, quality) {
    return new Promise((resolve) => {
      const url = canvas.toDataURL('image/jpeg', quality);
      const img = new Image();
      img.onload = () => {
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve();
      };
      img.src = url;
    });
  }

  function resizeCanvas() {
    const rect = document.getElementById('stage').getBoundingClientRect();
    view.width = rect.width;
    view.height = rect.height;
  }
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 250));
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resizeCanvas);
  }

  function drawLoop() {
    if (video.readyState >= 2) {
      const vw = video.videoWidth, vh = video.videoHeight;
      if (vw && vh) {
        // cover-fit source into view canvas aspect
        const vc = offscreen(view.width, view.height);
        const vctx = vc.getContext('2d');
        const scale = Math.max(view.width / vw, view.height / vh);
        const dw = vw * scale, dh = vh * scale;
        const dx = (view.width - dw) / 2, dy = (view.height - dh) / 2;
        vctx.save();
        if (facingMode === 'user') { vctx.translate(view.width, 0); vctx.scale(-1, 1); }
        vctx.drawImage(video, facingMode === 'user' ? view.width - dw - dx : dx, dy, dw, dh);
        vctx.restore();

        potatoFrame(vc, ctx, view.width, view.height, +potatoSlider.value, +noiseSlider.value, false, currentPotatoType);
      }
    }
    rafId = requestAnimationFrame(drawLoop);
  }

  async function startCamera() {
    try {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode, width: { ideal: 1280 }, height: { ideal: 1280 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      permMsg.style.display = 'none';
      resizeCanvas();
      if (!rafId) drawLoop();
    } catch (err) {
      permMsg.style.display = 'flex';
      console.error(err);
    }
  }

  askPerm.onclick = startCamera;
  flipBtn.onclick = () => {
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    startCamera();
  };

  function autoSave(blob, filename) {
    try {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      return true;
    } catch (err) {
      console.error('autoSave failed', err);
      return false;
    }
  }

  shutter.onclick = async () => {
    flashEl.classList.remove('on'); void flashEl.offsetWidth; flashEl.classList.add('on');

    const outW = view.width, outH = view.height;
    const shotCanvas = offscreen(outW, outH);
    const sctx2 = shotCanvas.getContext('2d');
    sctx2.drawImage(view, 0, 0);

    // extra final degradation: a couple of lossy JPEG passes, kept mild
    await reJpegMangle(shotCanvas, 0.35);
    await reJpegMangle(shotCanvas, 0.45);

    const blob = await new Promise(res => shotCanvas.toBlob(res, 'image/jpeg', 0.75));
    const id = Date.now();
    const filename = `potato-cam-${id}.jpg`;
    const url = URL.createObjectURL(blob);
    shots.unshift({ id, url, blob, filename });
    autoSave(blob, filename);
    dbPutPhoto({ id, blob, filename }).catch((err) => console.warn('Could not persist photo', err));
    savedToast.classList.add('on');
    setTimeout(() => savedToast.classList.remove('on'), 1400);
  };

  function openGallery(index) {
    gallery.classList.add('open');
    if (shots.length === 0) {
      galImg.style.display = 'none';
      galEmpty.style.display = 'block';
      galPrev.style.display = 'none';
      galNext.style.display = 'none';
      galActions.style.display = 'none';
      galCount.textContent = '';
      galIndex = -1;
      return;
    }
    galIndex = index >= 0 ? index : 0;
    renderGalImage();
  }

  function renderGalImage() {
    const s = shots[galIndex];
    galEmpty.style.display = 'none';
    galImg.style.display = 'block';
    galImg.src = s.url;
    galActions.style.display = 'flex';
    galCount.textContent = `${galIndex + 1} / ${shots.length}`;

    const multi = shots.length > 1;
    galPrev.style.display = multi ? 'flex' : 'none';
    galNext.style.display = multi ? 'flex' : 'none';
    galPrev.disabled = galIndex === 0;
    galNext.disabled = galIndex === shots.length - 1;
  }

  function goPrev() {
    if (galIndex > 0) { galIndex--; renderGalImage(); }
  }
  function goNext() {
    if (galIndex < shots.length - 1) { galIndex++; renderGalImage(); }
  }
  galPrev.onclick = goPrev;
  galNext.onclick = goNext;

  // Swipe left/right through photos
  let touchStartX = null;
  galImgWrap.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
  }, { passive: true });
  galImgWrap.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    touchStartX = null;
    const SWIPE_THRESHOLD = 40;
    if (dx > SWIPE_THRESHOLD) goPrev();       // swipe right → older photo
    else if (dx < -SWIPE_THRESHOLD) goNext(); // swipe left → newer photo
  }, { passive: true });

  galBtn.onclick = () => openGallery(shots.length ? 0 : -1);
  galClose.onclick = () => gallery.classList.remove('open');

  galSave.onclick = () => {
    const s = shots[galIndex];
    autoSave(s.blob, s.filename || `potato-cam-${Date.now()}.jpg`);
    galSave.textContent = 'Saved ✓';
    setTimeout(() => { galSave.textContent = 'Save again'; }, 1200);
  };

  galDel.onclick = () => {
    const removed = shots[galIndex];
    shots.splice(galIndex, 1);
    if (removed) dbDeletePhoto(removed.id).catch((err) => console.warn('Could not delete saved photo', err));
    if (shots.length === 0) { openGallery(-1); return; }
    galIndex = Math.min(galIndex, shots.length - 1);
    renderGalImage();
  };

  resizeCanvas();
  startCamera();
})();
</script>
</body>
</html>
